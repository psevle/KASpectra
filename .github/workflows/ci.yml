name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  cpp:
    name: C++ (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build -j
      - name: Test (full suite, slow tags included)
        run: ./build/test/kaspectra_tests
      - name: Examples smoke run
        run: |
          ./build/examples/bh_rates --n 3 > /dev/null
          ./build/examples/bh_spectrum --n 3 --Ep 1e9 > /dev/null

  python:
    name: Python bindings (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build and install wheel
        run: pip install . pytest numpy
      - name: Test (fast suite; slow tests are opt-in via -m slow)
        run: pytest
